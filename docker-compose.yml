services:
  dertinfo-api:
    container_name: api
    image: dertinfo/dertinfo-api
    build:
      context: ./apps/dert-api
      dockerfile: Dockerfile
    ports:
      - "44100:80"
    env_file:
      - ./infra/secrets/api.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80;
      - SqlConnection__ServerName=${SQL_SERVER_HOST:-sqlserver}
      - SendGrid__Enabled=false
      - StorageAccount__Images__BlobEndpoint=${AZURITE_BLOB_ENDPOINT:-http://azstorage:10000/devstoreaccount1}
    depends_on:
      sqlserver:
        condition: service_healthy
      azstorage:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    container_name: sqlserver
    environment:
      - MSSQL_SA_PASSWORD=myUn53cur3Pa55w0rd!
      - SA_PASSWORD=myUn53cur3Pa55w0rd!
      - ACCEPT_EULA=Y
    ports:
      - "44000:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "myUn53cur3Pa55w0rd!",
          "-C",
          "-Q",
          "SELECT 1",
          "-b",
        ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 10

  azstorage:
    container_name: azstorage
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - ./infra/data/azurite:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

  functions:
    container_name: functions
    image: dertinfo/dertinfo-imageresizev4
    build:
      context: ./apps/dert-functions
      dockerfile: Dockerfile
    ports:
      - "44400:80"
    env_file:
      - ./infra/secrets/functions.env
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=${AZURITE_BLOB_ENDPOINT:-http://azstorage:10000/devstoreaccount1};QueueEndpoint=${AZURITE_QUEUE_ENDPOINT:-http://azstorage:10001/devstoreaccount1};
      - StorageConnection__Images=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=${AZURITE_BLOB_ENDPOINT:-http://azstorage:10000/devstoreaccount1};QueueEndpoint=${AZURITE_QUEUE_ENDPOINT:-http://azstorage:10001/devstoreaccount1};
    depends_on:
      azstorage:
        condition: service_started

  web-frontend:
    container_name: web
    image: dertinfo/dertinfo-web
    build:
      context: ./apps/dert-web
      dockerfile: Dockerfile
    env_file:
      - ./infra/secrets/web.env
    ports:
      - "44200:4280"
    depends_on:
      - dertinfo-api

  app-frontend:
    container_name: app
    image: dertinfo/dertinfo-app
    build:
      context: ./apps/dert-app
      dockerfile: Dockerfile
    env_file:
      - ./infra/secrets/app.env
    ports:
      - "44300:4280"
    depends_on:
      - dertinfo-api

volumes:
  sqlserver-data:
