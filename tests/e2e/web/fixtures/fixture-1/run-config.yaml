# system-empty | system-basic | none
# A pack name applies that pack before the tests. It does not drop SQL or restart the API.
# none leaves the database as it is, so this fixture can follow another.
baseState: system-empty

# event1 | event2
# event1 is City Zoo Gathering. event2 is Ride a Giraffe.
eventData: event1

# group1 | group2
# group1 is The Simpsons. group2 is The Flanders.
groupData: group1

# none | errors | all
# none records nothing. This is the default.
# errors keeps clips only when the fixture fails.
# all keeps every clip.
video: none

# true | false
# true removes run-state files after a passing run.
# false leaves cookies, persona sessions, and chain.json.
# A failing run always leaves run-state.
clearSession: true

# Command line overrides, from tests/e2e:
#   npm run test:web:smoke -- --video all
#   npm run test:web:smoke -- --base-state none --clear-session false
#   npm run test:web:smoke -- --event-data event2 --group-data group2
