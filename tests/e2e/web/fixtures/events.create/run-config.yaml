# Fixture ids that must already have been run.
# The runner does not check this list. Fixtures share tests/e2e/shared-session.
requires: public.cookie-consent

# system-empty | system-basic | none
# none leaves the database as it is, so this fixture can follow another.
baseState: system-empty

# event1 | event2
eventData: event1

# none | errors | all
video: none

# true | false
clearSession: true
