# Fixture ids that must already have been run.
# An empty list means this fixture can run on its own.
# The runner does not check this yet.
requires: []

# system-empty | system-basic | none
# A pack name applies that pack before the test. It does not drop SQL or restart the API.
# none leaves the database as it is, so this fixture can follow another.
baseState: system-basic

# none | errors | all
# none records nothing. This is the default.
# errors keeps the clip only when the fixture fails.
# all keeps the clip.
video: none

# true | false
# true removes shared-session files after a passing run.
# false leaves them. A failing run always leaves shared-session.
clearSession: true

# Command line overrides, from tests/e2e:
#   npm run test:app:smoke -- --video all
#   node app/fixtures/scoring.venue-capture/run.mjs --base-state none --clear-session false
