<mat-toolbar class="topbar">
  <!-- Sidenav toggle button -->
  <button mat-icon-button id="sidenavToggle" (click)="toggleSidenav()" matTooltip="Toggle Hide/Open">
    <mat-icon>menu</mat-icon>
  </button>
  <!-- Sidenav toggle collapse -->
  <button *ngIf="sidenav.opened" mat-icon-button id="collapseToggle" fxHide.lt-md="true" (click)="toggleCollapse()"
    matTooltip="Toggle Collapse" class="toggle-collapsed">
    <mat-icon>chevron_left</mat-icon>
  </button>
