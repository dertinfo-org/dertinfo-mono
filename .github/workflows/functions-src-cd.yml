name: Functions Src CD

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        default: dev-only
        options:
          - full
          - dev-only
  push:
    branches: [main]
    paths:
      - 'apps/dert-functions/**'
      - '.github/workflows/functions-src-cd.yml'
      - '.github/workflows/reusable-src-build-push-docker.yml'
      - '.github/workflows/reusable-src-deploy-functionapp.yml'

concurrency:
  group: functions-src-cd
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore apps/dert-functions/src/dertinfo-image-resize/DertInfoImageResizeV4.csproj

      - name: Build
        run: dotnet build apps/dert-functions/src/dertinfo-image-resize/DertInfoImageResizeV4.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish apps/dert-functions/src/dertinfo-image-resize/DertInfoImageResizeV4.csproj --no-build --configuration Release --output "${{ runner.temp }}/publish"

      - name: Confirm Flex package layout
        run: |
          if [ ! -d "${{ runner.temp }}/publish/.azurefunctions" ]; then
            echo "Publish output is missing .azurefunctions (required for Flex One Deploy)." >&2
            ls -la "${{ runner.temp }}/publish"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/publish
          include-hidden-files: true
          if-no-files-found: error

  docker-dev:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    uses: ./.github/workflows/reusable-src-build-push-docker.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      environment: development
      dockerfile: apps/dert-functions/Dockerfile
      context: apps/dert-functions
      image_repository: dertinfo/dertinfo-imageresizev4

  deploy-dev:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-src-deploy-functionapp.yml
    with:
      environment: development
      package_path: .
      artifact_name: drop
      azure_oidc_workload: FUNCTIONS

  docker-prod:
    needs: deploy-dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')
    uses: ./.github/workflows/reusable-src-build-push-docker.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      environment: production
      dockerfile: apps/dert-functions/Dockerfile
      context: apps/dert-functions
      image_repository: dertinfo/dertinfo-imageresizev4

  deploy-prod:
    needs: [deploy-dev, build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-src-deploy-functionapp.yml
    with:
      environment: production
      package_path: .
      artifact_name: drop
      azure_oidc_workload: FUNCTIONS
