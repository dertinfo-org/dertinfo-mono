name: App Src CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/dert-app/**'
      - 'package.json'
      - '.github/workflows/app-src-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dert-app/src/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: apps/dert-app/src/client/package.json

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true

      - name: Build (hosted)
        run: npm run build:hosted
