name: API Src CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/dert-api/**'
      - 'packages/**'
      - 'dertinfo.sln'
      - 'Directory.Build.props'
      - '.github/workflows/api-src-ci.yml'

jobs:
  up-to-date:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require the pull request branch to contain main
        run: |
          git fetch origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          if [ "$behind" -ne 0 ]; then
            echo "This pull request is ${behind} commit(s) behind main. Update the branch so it contains every commit on main."
            git log --oneline HEAD..origin/main
            exit 1
          fi
          echo "This pull request contains every commit on main."

  build:
    needs: up-to-date
    if: ${{ !cancelled() && (needs.up-to-date.result == 'success' || needs.up-to-date.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore dertinfo.sln

      - name: Build
        run: dotnet build dertinfo.sln --no-restore --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: api-build-output
          retention-days: 1
          path: |
            apps/dert-api/src/**/bin/
            apps/dert-api/src/**/obj/

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: api-build-output
          path: apps/dert-api/src

      - name: Run unit tests
        run: |
          dotnet test apps/dert-api/src/dertinfo-api.utests/dertinfo-api.utests.csproj --no-build --configuration Release --verbosity normal
          dotnet test apps/dert-api/src/dertinfo-services.utests/dertinfo-services.utests.csproj --no-build --configuration Release --verbosity normal
          dotnet test apps/dert-api/src/dertinfo-repository.utests/dertinfo-repository.utests.csproj --no-build --configuration Release --verbosity normal

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      # Throwaway login for the ephemeral SQL container in this job. Not a hosted credential.
      SqlConnection__ServerName: 'localhost,1433'
      SqlConnection__DatabaseName: DertInfoDb
      SqlConnection__ServerAdminName: sa
      SqlConnection__ServerAdminPassword: CiOnlySqlPassw0rd
    services:
      sqlserver:
        # Keep this tag aligned with sqlserver in docker-compose.yml.
        image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CiOnlySqlPassw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnlySqlPassw0rd -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: api-build-output
          path: apps/dert-api/src

      # Environment check only: boot the API, migrate SQL Server, and GET /api/status.
      # The group fixtures are not part of this job.
      - name: Run integration tests
        run: dotnet test apps/dert-api/src/dertinfo-api.itests/dertinfo-api.itests.csproj --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName=DertInfo.Api.ITests.StatusController_Fixture_CheckStatus.Check_Status_Controller_Returns_Response"
