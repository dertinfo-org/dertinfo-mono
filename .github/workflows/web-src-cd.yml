name: Web Src CD

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        type: choice
        default: dev-only
        options:
          - full
          - dev-only
  push:
    branches: [main]
    paths:
      - 'apps/dert-web/**'
      - 'package.json'
      - '.github/workflows/web-src-cd.yml'
      - '.github/workflows/reusable-src-build-push-docker.yml'
      - '.github/workflows/reusable-src-deploy-static-web-app.yml'

concurrency:
  group: web-src-cd
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dert-web/src/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dert-web/src/client/package.json

      - name: Install
        run: npm install

      - name: Build hosted SPA
        run: npm run build:hosted

      - name: Include SWA config in artefact
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-swa-dist
          path: apps/dert-web/src/client/dist
          if-no-files-found: error
          retention-days: 7

  docker-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    uses: ./.github/workflows/reusable-src-build-push-docker.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      environment: development
      dockerfile: apps/dert-web/Dockerfile
      context: apps/dert-web
      image_repository: dertinfo/dertinfo-web

  deploy-dev:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'dev-only'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-src-deploy-static-web-app.yml
    secrets: inherit
    with:
      environment: development
      workload: web
      artifact_name: web-swa-dist

  docker-prod:
    needs: deploy-dev
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')
    uses: ./.github/workflows/reusable-src-build-push-docker.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      environment: production
      dockerfile: apps/dert-web/Dockerfile
      context: apps/dert-web
      image_repository: dertinfo/dertinfo-web

  deploy-prod:
    needs: [build, deploy-dev]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'full')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-src-deploy-static-web-app.yml
    secrets: inherit
    with:
      environment: production
      workload: web
      artifact_name: web-swa-dist
